[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "site-email-finder"
version = "0.1.0"
description = "Crawl business websites from a CSV export and extract contact email addresses."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Your Name Here" }]
keywords = ["email", "scraper", "csv", "lead-generation", "crawler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
site-email-finder = "site_email_finder.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/site-email-finder"
Issues = "https://github.com/YOUR-USERNAME/site-email-finder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
